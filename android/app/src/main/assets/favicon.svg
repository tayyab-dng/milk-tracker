<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="drop" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#818CF8"/>
      <stop offset="50%" style="stop-color:#6366F1"/>
      <stop offset="100%" style="stop-color:#4F46E5"/>
    </linearGradient>
    <linearGradient id="shine" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:0.6"/>
      <stop offset="100%" style="stop-color:#ffffff;stop-opacity:0"/>
    </linearGradient>
  </defs>
  <!-- Milk drop shape -->
  <path d="M50 8 C50 8, 20 45, 20 62 C20 78.5, 33.4 92, 50 92 C66.6 92, 80 78.5, 80 62 C80 45, 50 8, 50 8Z" fill="url(#drop)"/>
  <!-- Shine highlight -->
  <ellipse cx="38" cy="52" rx="10" ry="14" fill="url(#shine)" transform="rotate(-20, 38, 52)"/>
  <!-- Small sparkle -->
  <circle cx="60" cy="70" r="3" fill="white" opacity="0.3"/>
</svg>